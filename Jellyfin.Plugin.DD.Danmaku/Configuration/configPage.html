<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>DD-Danmaku 弹幕插件</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; color: #fff; background: #101010; }
        h1 { font-size: 24px; margin-bottom: 20px; }
        .section { margin-bottom: 24px; padding: 16px; background: #1a1a1a; border-radius: 8px; }
        .section h2 { font-size: 16px; margin-bottom: 12px; color: #00a4dc; }
        .field { margin-bottom: 12px; display: flex; align-items: center; gap: 12px; }
        .field label { min-width: 160px; }
        .field input[type="checkbox"] { width: 18px; height: 18px; }
        .field input[type="text"] { flex: 1; padding: 6px 10px; border-radius: 4px; border: 1px solid #333; background: #222; color: #fff; }
        button { padding: 8px 20px; background: #00a4dc; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0088bb; }
        .status { padding: 12px; border-radius: 4px; margin-top: 12px; display: none; }
        .status.success { background: #1a3a1a; display: block; }
        .status.error { background: #3a1a1a; display: block; }
    </style>
</head>
<body>
    <h1>DD-Danmaku 弹幕插件</h1>

    <div class="section">
        <h2>基本设置</h2>
        <div class="field">
            <label>启用自动注入</label>
            <input type="checkbox" id="autoInjection" checked />
        </div>
        <div class="field">
            <label>启用 ede.js 资源</label>
            <input type="checkbox" id="edeResource" checked />
        </div>
        <div class="field">
            <label>文件持久化</label>
            <input type="checkbox" id="filePersistence" />
        </div>
        <div class="field">
            <label>自动刷新弹幕</label>
            <input type="checkbox" id="autoRefresh" />
        </div>
    </div>

    <div class="section">
        <h2>弹幕 API</h2>
        <div class="field">
            <label>API 地址</label>
            <input type="text" id="apiUrl" placeholder="https://api.dandanplay.net" />
        </div>
        <div class="field">
            <label>匹配策略</label>
            <input type="text" id="matchStrategy" value="traditional-first" />
        </div>
    </div>

    <div class="section">
        <h2>AI 匹配</h2>
        <div class="field">
            <label>启用 AI 匹配</label>
            <input type="checkbox" id="aiEnabled" />
        </div>
        <div class="field">
            <label>AI 服务地址</label>
            <input type="text" id="aiBaseUrl" placeholder="https://api.openai.com/v1" />
        </div>
        <div class="field">
            <label>AI 模型</label>
            <input type="text" id="aiModel" placeholder="gpt-4o-mini" />
        </div>
    </div>

    <button id="saveBtn">保存设置</button>
    <div id="status" class="status"></div>

    <script>
        const pluginId = '4b59d7ce-5a09-4f14-a5ca-0b9e9c8e53d7';

        async function loadConfig() {
            try {
                const response = await ApiClient.getPluginConfiguration(pluginId);
                document.getElementById('autoInjection').checked = response.AutoInjectionEnabled !== false;
                document.getElementById('edeResource').checked = response.EdeResourceEnabled !== false;
                document.getElementById('filePersistence').checked = response.FilePersistenceEnabled === true;
                document.getElementById('autoRefresh').checked = response.AutoRefreshOnNextPlayback === true;
                document.getElementById('apiUrl').value = response.ApiUrl || '';
                document.getElementById('matchStrategy').value = response.MatchStrategy || 'traditional-first';
                document.getElementById('aiEnabled').checked = response.AiEnabled === true;
                document.getElementById('aiBaseUrl').value = response.AiBaseUrl || '';
                document.getElementById('aiModel').value = response.AiModel || '';
            } catch (e) {
                console.error('加载配置失败:', e);
            }
        }

        async function saveConfig() {
            const statusEl = document.getElementById('status');
            try {
                const config = await ApiClient.getPluginConfiguration(pluginId);
                config.AutoInjectionEnabled = document.getElementById('autoInjection').checked;
                config.EdeResourceEnabled = document.getElementById('edeResource').checked;
                config.FilePersistenceEnabled = document.getElementById('filePersistence').checked;
                config.AutoRefreshOnNextPlayback = document.getElementById('autoRefresh').checked;
                config.ApiUrl = document.getElementById('apiUrl').value;
                config.MatchStrategy = document.getElementById('matchStrategy').value;
                config.AiEnabled = document.getElementById('aiEnabled').checked;
                config.AiBaseUrl = document.getElementById('aiBaseUrl').value;
                config.AiModel = document.getElementById('aiModel').value;

                await ApiClient.updatePluginConfiguration(pluginId, config);
                Dashboard.processPluginConfigurationUpdateResult({ Success: true });
                statusEl.className = 'status success';
                statusEl.textContent = '设置已保存';
            } catch (e) {
                Dashboard.processPluginConfigurationUpdateResult({ Success: false, ErrorMessage: e.message });
                statusEl.className = 'status error';
                statusEl.textContent = '保存失败: ' + e.message;
            }
        }

        document.getElementById('saveBtn').addEventListener('click', saveConfig);
        loadConfig();
    </script>
</body>
</html>
