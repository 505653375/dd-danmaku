<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>DD-Danmaku Settings</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; color: #fff; background: #101010; max-width: 800px; }
        h1 { font-size: 24px; margin-bottom: 24px; }
        .section { margin-bottom: 24px; padding: 20px; background: #1a1a1a; border-radius: 8px; border: 1px solid #333; }
        .section h2 { font-size: 16px; margin: 0 0 16px 0; color: #00a4dc; }
        .field { margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
        .field label { min-width: 140px; flex-shrink: 0; }
        .field input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        .field input[type="text"], .field select { flex: 1; padding: 8px 12px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; font-size: 14px; }
        .field input[type="text"]:focus, .field select:focus { outline: none; border-color: #00a4dc; }
        button { padding: 10px 24px; background: #00a4dc; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-top: 8px; }
        button:hover { background: #0088bb; }
        .status { padding: 12px; border-radius: 4px; margin-top: 16px; display: none; font-size: 14px; }
        .status.show { display: block; }
        .status.success { background: #1a3a1a; color: #8f8; border: 1px solid #2a5a2a; }
        .status.error { background: #3a1a1a; color: #f88; border: 1px solid #5a2a2a; }
    </style>
</head>
<body>
    <h1>DD-Danmaku 弹幕插件</h1>

    <div class="section">
        <h2>基本设置</h2>
        <div class="field">
            <label><input type="checkbox" id="autoInjection" checked> 启用自动注入</label>
        </div>
        <div class="field">
            <label><input type="checkbox" id="edeResource" checked> 启用 ede.js 资源</label>
        </div>
        <div class="field">
            <label><input type="checkbox" id="filePersistence"> 文件持久化</label>
        </div>
        <div class="field">
            <label><input type="checkbox" id="autoRefresh"> 自动刷新弹幕</label>
        </div>
    </div>

    <div class="section">
        <h2>弹幕 API</h2>
        <div class="field">
            <label for="apiUrl">API 地址</label>
            <input type="text" id="apiUrl" placeholder="https://api.dandanplay.net">
        </div>
        <div class="field">
            <label for="matchStrategy">匹配策略</label>
            <select id="matchStrategy">
                <option value="traditional-first">传统优先</option>
                <option value="ai-first">AI优先</option>
            </select>
        </div>
    </div>

    <div class="section">
        <h2>AI 匹配</h2>
        <div class="field">
            <label><input type="checkbox" id="aiEnabled"> 启用 AI 匹配</label>
        </div>
        <div class="field">
            <label for="aiBaseUrl">AI 服务地址</label>
            <input type="text" id="aiBaseUrl" placeholder="https://api.openai.com/v1">
        </div>
        <div class="field">
            <label for="aiModel">AI 模型</label>
            <input type="text" id="aiModel" placeholder="gpt-4o-mini">
        </div>
    </div>

    <button id="saveBtn">保存设置</button>
    <div id="status" class="status"></div>

    <script>
    (function() {
        var pluginId = '4b59d7ce-5a09-4f14-a5ca-0b9e9c8e53d7';

        function showStatus(msg, isError) {
            var el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status show ' + (isError ? 'error' : 'success');
        }

        // Load config
        ApiClient.getPluginConfiguration(pluginId).then(function(config) {
            document.getElementById('autoInjection').checked = config.AutoInjectionEnabled !== false;
            document.getElementById('edeResource').checked = config.EdeResourceEnabled !== false;
            document.getElementById('filePersistence').checked = config.FilePersistenceEnabled === true;
            document.getElementById('autoRefresh').checked = config.AutoRefreshOnNextPlayback === true;
            document.getElementById('apiUrl').value = config.ApiUrl || '';
            document.getElementById('matchStrategy').value = config.MatchStrategy || 'traditional-first';
            document.getElementById('aiEnabled').checked = config.AiEnabled === true;
            document.getElementById('aiBaseUrl').value = config.AiBaseUrl || '';
            document.getElementById('aiModel').value = config.AiModel || '';
            console.log('Config loaded:', JSON.stringify(config));
        }).catch(function(e) {
            showStatus('加载配置失败: ' + e.message, true);
            console.error('Load error:', e);
        });

        // Save config
        document.getElementById('saveBtn').addEventListener('click', function() {
            ApiClient.getPluginConfiguration(pluginId).then(function(config) {
                config.AutoInjectionEnabled = document.getElementById('autoInjection').checked;
                config.EdeResourceEnabled = document.getElementById('edeResource').checked;
                config.FilePersistenceEnabled = document.getElementById('filePersistence').checked;
                config.AutoRefreshOnNextPlayback = document.getElementById('autoRefresh').checked;
                config.ApiUrl = document.getElementById('apiUrl').value;
                config.MatchStrategy = document.getElementById('matchStrategy').value;
                config.AiEnabled = document.getElementById('aiEnabled').checked;
                config.AiBaseUrl = document.getElementById('aiBaseUrl').value;
                config.AiModel = document.getElementById('aiModel').value;

                console.log('Saving config:', JSON.stringify(config));

                ApiClient.updatePluginConfiguration(pluginId, config).then(function(result) {
                    console.log('Save result:', JSON.stringify(result));
                    showStatus('保存成功!', false);
                }).catch(function(e) {
                    showStatus('保存失败: ' + e.message, true);
                    console.error('Save error:', e);
                });
            }).catch(function(e) {
                showStatus('加载配置失败: ' + e.message, true);
                console.error('Load error:', e);
            });
        });
    })();
    </script>
</body>
</html>
