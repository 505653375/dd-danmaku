<div id="pluginConfigurationPage" data-role="page" class="page type-interior pluginConfigurationPage">
    <div data-role="content">
        <div class="content-primary">
            <form id="configForm" class="configForm">
                <h1>DD-Danmaku 弹幕插件</h1>

                <div class="configFormFields">
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label>
                            <input type="checkbox" id="autoInjection" checked />
                            <span>启用自动注入</span>
                        </label>
                        <div class="fieldDescription">在播放页面自动注入弹幕脚本</div>
                    </div>

                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label>
                            <input type="checkbox" id="edeResource" checked />
                            <span>启用 ede.js 资源</span>
                        </label>
                        <div class="fieldDescription">提供弹幕引擎脚本</div>
                    </div>

                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label>
                            <input type="checkbox" id="filePersistence" />
                            <span>文件持久化</span>
                        </label>
                        <div class="fieldDescription">将弹幕保存为本地 XML 文件</div>
                    </div>

                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label>
                            <input type="checkbox" id="autoRefresh" />
                            <span>自动刷新弹幕</span>
                        </label>
                        <div class="fieldDescription">下次播放时自动刷新弹幕</div>
                    </div>

                    <div class="inputContainer">
                        <label class="inputLabel" for="apiUrl">API 地址</label>
                        <input type="text" id="apiUrl" class="emby-input" placeholder="https://api.dandanplay.net" />
                    </div>

                    <div class="selectContainer">
                        <label class="selectLabel" for="matchStrategy">匹配策略</label>
                        <select id="matchStrategy" class="emby-select">
                            <option value="traditional-first">传统优先</option>
                            <option value="ai-first">AI优先</option>
                        </select>
                    </div>

                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label>
                            <input type="checkbox" id="aiEnabled" />
                            <span>启用 AI 匹配</span>
                        </label>
                        <div class="fieldDescription">使用 AI 进行智能剧集匹配</div>
                    </div>

                    <div class="inputContainer">
                        <label class="inputLabel" for="aiBaseUrl">AI 服务地址</label>
                        <input type="text" id="aiBaseUrl" class="emby-input" placeholder="https://api.openai.com/v1" />
                    </div>

                    <div class="inputContainer">
                        <label class="inputLabel" for="aiModel">AI 模型</label>
                        <input type="text" id="aiModel" class="emby-input" placeholder="gpt-4o-mini" />
                    </div>
                </div>

                <button type="submit" class="raised button-submit block emby-button" id="saveBtn">
                    <span>保存</span>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
(function() {
    var pluginId = '4b59d7ce-5a09-4f14-a5ca-0b9e9c8e53d7';
    var page = document.querySelector('#pluginConfigurationPage');
    var configForm = document.querySelector('#configForm');

    function showStatus(msg, isError) {
        var existing = page.querySelector('.configPageFooter');
        if (existing) existing.remove();
        var footer = document.createElement('div');
        footer.className = 'configPageFooter';
        footer.style.padding = '12px';
        footer.style.borderRadius = '4px';
        footer.style.marginTop = '16px';
        footer.style.background = isError ? '#3a1a1a' : '#1a3a1a';
        footer.style.color = isError ? '#f88' : '#8f8';
        footer.textContent = msg;
        page.appendChild(footer);
    }

    page.addEventListener('pageshow', function () {
        ApiClient.getPluginConfiguration(pluginId).then(function (config) {
            document.querySelector('#autoInjection').checked = config.AutoInjectionEnabled !== false;
            document.querySelector('#edeResource').checked = config.EdeResourceEnabled !== false;
            document.querySelector('#filePersistence').checked = config.FilePersistenceEnabled === true;
            document.querySelector('#autoRefresh').checked = config.AutoRefreshOnNextPlayback === true;
            document.querySelector('#apiUrl').value = config.ApiUrl || '';
            document.querySelector('#matchStrategy').value = config.MatchStrategy || 'traditional-first';
            document.querySelector('#aiEnabled').checked = config.AiEnabled === true;
            document.querySelector('#aiBaseUrl').value = config.AiBaseUrl || '';
            document.querySelector('#aiModel').value = config.AiModel || '';
            console.log('Config loaded:', JSON.stringify(config));
        }).catch(function(e) {
            showStatus('加载配置失败: ' + e.message, true);
            console.error('Load error:', e);
        });
    });

    configForm.addEventListener('submit', function (e) {
        e.preventDefault();
        ApiClient.getPluginConfiguration(pluginId).then(function (config) {
            config.AutoInjectionEnabled = document.querySelector('#autoInjection').checked;
            config.EdeResourceEnabled = document.querySelector('#edeResource').checked;
            config.FilePersistenceEnabled = document.querySelector('#filePersistence').checked;
            config.AutoRefreshOnNextPlayback = document.querySelector('#autoRefresh').checked;
            config.ApiUrl = document.querySelector('#apiUrl').value;
            config.MatchStrategy = document.querySelector('#matchStrategy').value;
            config.AiEnabled = document.querySelector('#aiEnabled').checked;
            config.AiBaseUrl = document.querySelector('#aiBaseUrl').value;
            config.AiModel = document.querySelector('#aiModel').value;

            console.log('Saving config:', JSON.stringify(config));

            ApiClient.updatePluginConfiguration(pluginId, config).then(function (result) {
                console.log('Save result:', JSON.stringify(result));
                showStatus('保存成功!', false);
            }).catch(function(e) {
                showStatus('保存失败: ' + e.message, true);
                console.error('Save error:', e);
            });
        }).catch(function(e) {
            showStatus('加载配置失败: ' + e.message, true);
            console.error('Load error:', e);
        });
    });
})();
</script>
