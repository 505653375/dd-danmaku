<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>DD-Danmaku Settings</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; color: #fff; background: #101010; }
        h1 { font-size: 24px; margin-bottom: 20px; }
        .section { margin-bottom: 24px; padding: 16px; background: #1a1a1a; border-radius: 8px; }
        .section h2 { font-size: 16px; margin-bottom: 12px; color: #00a4dc; }
        .field { margin-bottom: 12px; display: flex; align-items: center; gap: 12px; }
        .field label { min-width: 160px; }
        .field input[type="checkbox"] { width: 18px; height: 18px; }
        .field input[type="text"] { flex: 1; padding: 6px 10px; border-radius: 4px; border: 1px solid #333; background: #222; color: #fff; }
        button { padding: 8px 20px; background: #00a4dc; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover { background: #0088bb; }
        .status { padding: 12px; border-radius: 4px; margin-top: 12px; display: none; }
        .status.show { display: block; }
        .status.success { background: #1a3a1a; color: #6f6; }
        .status.error { background: #3a1a1a; color: #f66; }
    </style>
</head>
<body>
    <h1>DD-Danmaku</h1>

    <div class="section">
        <h2>Basic</h2>
        <div class="field"><label>Auto Injection</label><input type="checkbox" id="autoInjection" checked /></div>
        <div class="field"><label>EDE Resource</label><input type="checkbox" id="edeResource" checked /></div>
        <div class="field"><label>File Persistence</label><input type="checkbox" id="filePersistence" /></div>
        <div class="field"><label>Auto Refresh</label><input type="checkbox" id="autoRefresh" /></div>
    </div>

    <div class="section">
        <h2>Danmaku API</h2>
        <div class="field"><label>API URL</label><input type="text" id="apiUrl" placeholder="https://api.dandanplay.net" /></div>
        <div class="field"><label>Match Strategy</label><input type="text" id="matchStrategy" value="traditional-first" /></div>
    </div>

    <div class="section">
        <h2>AI Matching</h2>
        <div class="field"><label>Enable AI</label><input type="checkbox" id="aiEnabled" /></div>
        <div class="field"><label>AI Base URL</label><input type="text" id="aiBaseUrl" placeholder="https://api.openai.com/v1" /></div>
        <div class="field"><label>AI Model</label><input type="text" id="aiModel" placeholder="gpt-4o-mini" /></div>
    </div>

    <button id="saveBtn">Save</button>
    <div id="status" class="status"></div>

    <script>
    (function() {
        var pluginId = '4b59d7ce-5a09-4f14-a5ca-0b9e9c8e53d7';
        var baseApi = '/Plugins/' + pluginId + '/Configuration';

        function getToken() {
            try {
                var keys = Object.keys(localStorage);
                for (var i = 0; i < keys.length; i++) {
                    if (keys[i].indexOf('jellyfin') >= 0 && keys[i].indexOf('token') >= 0) {
                        var val = localStorage.getItem(keys[i]);
                        if (val && val.length > 10) return val;
                    }
                }
            } catch(e) {}
            var m = location.search.match(/api_key=([^&]+)/);
            if (m) return m[1];
            return '';
        }

        function apiCall(method, body) {
            var headers = { 'Content-Type': 'application/json' };
            var token = getToken();
            if (token) headers['Authorization'] = 'MediaBrowser Token="' + token + '"';
            var opts = { method: method, headers: headers };
            if (body) opts.body = JSON.stringify(body);
            return fetch(baseApi, opts).then(function(r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            });
        }

        function loadConfig() {
            apiCall('GET').then(function(config) {
                document.getElementById('autoInjection').checked = config.AutoInjectionEnabled !== false;
                document.getElementById('edeResource').checked = config.EdeResourceEnabled !== false;
                document.getElementById('filePersistence').checked = config.FilePersistenceEnabled === true;
                document.getElementById('autoRefresh').checked = config.AutoRefreshOnNextPlayback === true;
                document.getElementById('apiUrl').value = config.ApiUrl || '';
                document.getElementById('matchStrategy').value = config.MatchStrategy || 'traditional-first';
                document.getElementById('aiEnabled').checked = config.AiEnabled === true;
                document.getElementById('aiBaseUrl').value = config.AiBaseUrl || '';
                document.getElementById('aiModel').value = config.AiModel || '';
            }).catch(function(e) {
                showStatus('Load error: ' + e.message, 'error');
            });
        }

        function saveConfig() {
            var config = {
                AutoInjectionEnabled: document.getElementById('autoInjection').checked,
                EdeResourceEnabled: document.getElementById('edeResource').checked,
                FilePersistenceEnabled: document.getElementById('filePersistence').checked,
                AutoRefreshOnNextPlayback: document.getElementById('autoRefresh').checked,
                ApiUrl: document.getElementById('apiUrl').value,
                MatchStrategy: document.getElementById('matchStrategy').value,
                AiEnabled: document.getElementById('aiEnabled').checked,
                AiBaseUrl: document.getElementById('aiBaseUrl').value,
                AiModel: document.getElementById('aiModel').value
            };
            apiCall('POST', config).then(function() {
                showStatus('Saved!', 'success');
            }).catch(function(e) {
                showStatus('Save error: ' + e.message, 'error');
            });
        }

        function showStatus(msg, type) {
            var el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status show ' + type;
        }

        document.getElementById('saveBtn').addEventListener('click', saveConfig);
    })();
    </script>
</body>
</html>
